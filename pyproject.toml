[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protinvtree"
version = "0.1.0"
description = "ProtInvTree: reward-guided tree search for protein inverse folding"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch>=2.2,<2.6",
  "transformers>=4.46.3,<4.48.2",
  "huggingface-hub>=0.23.2,<1",
  "numpy>=1.23,<2",
  "biotite==0.41.2",
  "tmtools>=0.2,<0.4",
  "einops>=0.7",
  "attrs>=23.2",
  "tqdm>=4.65",
  "msgpack-numpy>=0.4.8",
  "biopython>=1.83",
  "scikit-learn>=1.3",
  "brotli>=1.1",
  "pandas>=1.5",
  "cloudpathlib>=0.18",
  "tenacity>=8.2",
  "zstd>=1.5",
]

[project.scripts]
protinvtree-evaluate = "protinvtree.evaluate:main"
protinvtree-infer = "protinvtree.infer:main"

[tool.setuptools]
license-files = ["LICENSE.md", "THIRD_PARTY_NOTICES.md", "third_party/ESM_LICENSE.md", "third_party/ESM_CONTRIBUTIONS.md"]

[tool.setuptools.packages.find]
where = ["."]
include = ["protinvtree*", "esm*"]
namespaces = true

[tool.setuptools.package-data]
esm = ["data/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["esm"]
