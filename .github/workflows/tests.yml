name: Software checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Run software regression tests without pretrained weights
        run: python -m unittest discover -s tests -v
      - name: Validate CATH-format fixture
        run: python scripts/evaluate_cath.py --data-dir examples/cath --output-dir results/check --dry-run
